<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">

<style>
html,body{margin:0;padding:0;background:#0d0d0d;color:#e5e5e5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100%;}
.wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;}
.spin{width:32px;height:32px;border:3px solid #333;border-top-color:#888;border-radius:50%;animation:s 0.8s linear infinite;}
</style>
<style>@keyframes s{to{transform:rotate(360deg);}}</style>
</head>
<body>
<div class="wrap">
<div class="spin"></div>
<div>Chargement de la dernière version...</div>
</div>
<script>
// Enregistre le Service Worker (best effort), puis redirige. La redirection ne dépend
// PAS du SW (try/catch + toujours exécutée) pour ne jamais bloquer l'accès au plan.
(function () {
  try {
    if ('serviceWorker' in navigator) {
      // updateViaCache:'none' -> sw.js toujours revalide (detection fiable des MAJ).
      // .update() force une verification immediate des le demarrage.
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function (r) { if (r) r.update(); }).catch(function () {});
    }
  } catch (e) {}
  location.replace('plan_complet_secured.html');
})();
</script>
<noscript>
<meta http-equiv="refresh" content="0;url=plan_complet_secured.html">
<p style="text-align:center;">JavaScript requis. <a href="plan_complet_secured.html" style="color:#7ab;">Continuer</a></p>
</noscript>
</body>
</html>
